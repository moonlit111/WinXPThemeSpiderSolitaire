<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蜘蛛纸牌</title>
  <link rel="icon" type="image/png" href="assets/ui/spider_icon.png">
  <link rel="stylesheet" href="styles/winxp.css">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body>

  <!-- Windows XP Window Frame -->
  <div class="xp-window">
    
    <!-- Title Bar -->
    <div class="xp-titlebar">
      <div class="xp-titlebar-text">
        <img class="xp-titlebar-icon" src="assets/ui/spider_icon.png" alt="Spider Icon">
        <span>蜘蛛纸牌</span>
      </div>
      <div class="xp-titlebar-controls">
        <button class="xp-btn-title xp-btn-min" id="btn-min" title="最小化">0</button>
        <button class="xp-btn-title xp-btn-max" id="btn-max" title="最大化">1</button>
        <button class="xp-btn-title xp-btn-close" id="btn-close" title="关闭">r</button>
      </div>
    </div>

    <!-- Classic Menu Bar (RT_MENU 101: 游戏, 发牌, 帮助) -->
    <div class="xp-menubar">
      <!-- 游戏(&G) -->
      <div class="xp-menu-item" id="menu-game">
        <span>游戏(<u>G</u>)</span>
        <div class="xp-menu-dropdown">
          <div class="xp-dropdown-row" data-action="new-game">
            <span>开局(<u>N</u>)</span>
            <span class="xp-dropdown-shortcut">F2</span>
          </div>
          <div class="xp-dropdown-row" data-action="restart">
            <span>重新开局(<u>R</u>)</span>
          </div>
          <div class="xp-dropdown-separator"></div>
          <div class="xp-dropdown-row" data-action="undo">
            <span>撤销(<u>U</u>)</span>
            <span class="xp-dropdown-shortcut">Ctrl+Z</span>
          </div>
          <div class="xp-dropdown-row" data-action="deal">
            <span>新一轮发牌(<u>D</u>)</span>
            <span class="xp-dropdown-shortcut">D</span>
          </div>
          <div class="xp-dropdown-row" data-action="hint">
            <span>显示可行的操作(<u>M</u>)</span>
            <span class="xp-dropdown-shortcut">M</span>
          </div>
          <div class="xp-dropdown-separator"></div>
          <div class="xp-dropdown-row" data-action="difficulty">
            <span>难易级别(<u>I</u>)...</span>
            <span class="xp-dropdown-shortcut">F3</span>
          </div>
          <div class="xp-dropdown-row" data-action="stats">
            <span>战况(<u>T</u>)...</span>
            <span class="xp-dropdown-shortcut">F4</span>
          </div>
          <div class="xp-dropdown-row" data-action="options">
            <span>选项(<u>P</u>)...</span>
            <span class="xp-dropdown-shortcut">F5</span>
          </div>
          <div class="xp-dropdown-separator"></div>
          <div class="xp-dropdown-row" data-action="save-game">
            <span>保存本次游戏(<u>S</u>)</span>
            <span class="xp-dropdown-shortcut">Ctrl+S</span>
          </div>
          <div class="xp-dropdown-row" data-action="load-game">
            <span>打开上次保存的游戏(<u>O</u>)...</span>
            <span class="xp-dropdown-shortcut">Ctrl+O</span>
          </div>
          <div class="xp-dropdown-separator"></div>
          <div class="xp-dropdown-row" data-action="exit">
            <span>退出(<u>X</u>)</span>
          </div>
        </div>
      </div>

      <!-- 发牌(&D) - Direct menu bar trigger from RT_MENU 101 -->
      <div class="xp-menu-item" id="menu-deal-direct" data-action="deal" style="cursor: pointer;">
        <span>发牌(<u>D</u>)</span>
      </div>

      <!-- 帮助(&H) -->
      <div class="xp-menu-item" id="menu-help">
        <span>帮助(<u>H</u>)</span>
        <div class="xp-menu-dropdown">
          <div class="xp-dropdown-row" data-action="rules">
            <span>目录(<u>C</u>)</span>
            <span class="xp-dropdown-shortcut">F1</span>
          </div>
          <div class="xp-dropdown-separator"></div>
          <div class="xp-dropdown-row" data-action="about">
            <span>关于蜘蛛(<u>A</u>)...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Game Board on Felt -->
    <div id="game-container" class="game-container">
      <!-- 10 Tableau Columns (FUN_01005ca9) -->
      <div class="tableau-area"></div>

      <!-- Bottom Bar: Foundations (Left), Scoreboard (Center), Stock (Right) -->
      <div class="bottom-area">
        <div class="foundation-area" title="已完成的花色牌组"></div>
        
        <!-- 1:1 Windows XP Green Scoreboard (FUN_01004a10 / FUN_01003811) -->
        <div class="xp-scoreboard" id="board-scoreboard" data-action="hint" title="显示可行的操作 (M)">
          <div class="xp-scoreboard-row xp-scoreboard-row-score">
            <span class="xp-scoreboard-label">得分:</span>
            <span class="xp-scoreboard-val" id="status-score">500</span>
          </div>
          <div class="xp-scoreboard-row xp-scoreboard-row-moves">
            <span class="xp-scoreboard-label">移牌次数:</span>
            <span class="xp-scoreboard-val" id="status-moves">0</span>
          </div>
        </div>

        <div class="stock-area" title="点击发新一轮牌 (D)"></div>
      </div>

      <!-- Canvas for Windows XP Classic Victory Bounce Animation -->
      <canvas id="victory-canvas"></canvas>
    </div>

    <!-- Classic XP Modal Dialog Component -->
    <div class="xp-dialog-overlay" id="dialog-overlay">
      <div class="xp-dialog" id="xp-dialog-box">
        <div class="xp-dialog-titlebar">
          <span id="dialog-title">蜘蛛纸牌</span>
          <button class="xp-btn-title xp-btn-close" id="dialog-close-btn" style="width:16px;height:16px;font-size:9px;">r</button>
        </div>
        <div class="xp-dialog-body" id="dialog-body">
          <div id="dialog-content"></div>
        </div>
        <div class="xp-dialog-footer" id="dialog-footer"></div>
      </div>
    </div>

  </div>

  <!-- Layer for dragging cards with high z-index -->
  <div id="drag-layer"></div>

  <!-- Distribution Script -->
  <script src="dist/spider.bundle.js"></script>
</body>
</html>
